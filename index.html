<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多格式引用生成器</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Source+Serif+Pro:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">

        <header class="header">
            <h1 class="header__title">多格式引用生成器</h1>
            <p class="header__subtitle">输入一个或多个文献标题，选择格式，即刻生成专业引用</p>
        </header>
        <nav class="view-switcher">
            <button class="view-switcher__button active" data-view="generator">生成器</button>
            <button class="view-switcher__button" data-view="history">历史记录</button>
        </nav>
        <main class="main-content">

            <div id="generator-view" class="view active">
                <section class="citation-generator">
                    <form class="citation-generator__form" id="citation-form">
                        
                        <div class="generator-controls">
                            <div class="generator-controls__group">
                                <label for="style-selector" class="generator-controls__label">引用格式:</label>
                                <select id="style-selector" class="generator-controls__select">
                                    <option value="apa">APA 7</option>
                                    <option value="mla">MLA 9</option>
                                    <option value="chicago">Chicago 17 (Author-Date)</option>
                                </select>
                            </div>
                        </div>
                        <textarea 
                            class="citation-generator__textarea" 
                            id="batch-title-input"
                            placeholder="在此处粘贴一个或多个文献标题，每行一个..."
                            rows="5"
                        ></textarea>

                        <div class="generator-actions">
                             <button type="button" class="citation-generator__button--secondary" id="clear-input-btn">清空</button>
                             <button type="submit" class="citation-generator__button">生成引用</button>
                        </div>

                    </form>
                </section>

                <section class="bulk-actions" id="bulk-actions-container">
                    </section>
                <section class="citation-results" id="results-container">
                    </section>
                </div>
            <div id="history-view" class="view">
                <section class="history-list" id="history-list-container">
                    </section>
            </div>
            </main>
        <footer class="footer">
            <p class="footer__text">© 2025 | 由小吴构建</p>
        </footer>
        </div> <script src="js/script.js" defer></script>
</body>
</html>
